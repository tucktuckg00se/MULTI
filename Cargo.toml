[workspace]
resolver = "3"
members = ["crates/*"]
# spikes/ is its own throwaway workspace (M0); it is not part of the product.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tucktuckg00se/MULTI"
publish = false

[workspace.dependencies]
multi-core = { path = "crates/multi-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
