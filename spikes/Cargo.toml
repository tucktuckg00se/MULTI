# Throwaway M0 experiments. Nothing here ships; see docs/m0/README.md.
[workspace]
resolver = "3"
members = ["harness", "cc"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
