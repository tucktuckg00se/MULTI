[package]
name = "s6-e2e"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Heavy (CUDA) build: SHERPA_ONNX_LIB_DIR=<sherpa-onnx CUDA lib dir> cargo build --release -p s6-e2e
[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
s2-gst-pipe = { path = "../s2-gst-pipe" }
s2b-gst-cc = { path = "../s2b-gst-cc" }
s4-asr = { path = "../s4-asr" }
s5-translate = { path = "../s5-translate" }
ct2rs = { version = "=0.10.1", default-features = false, features = ["cuda", "ruy", "sentencepiece", "tokenizers", "whisper"] }
gst = { package = "gstreamer", version = "0.25", features = ["v1_24"] }
gst-app = { package = "gstreamer-app", version = "0.25", features = ["v1_24"] }
gst-video = { package = "gstreamer-video", version = "0.25", features = ["v1_24"] }
