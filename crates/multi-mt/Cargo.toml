[package]
name = "multi-mt"
description = "MULTI translation worker: opus-mt via CTranslate2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# CUDA inference (fp16). Without it the worker runs on CPU (int8).
cuda = ["ct2rs/cuda"]

[dependencies]
multi-core.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ct2rs = { version = "=0.10.1", default-features = false, features = ["ruy", "sentencepiece"] }

[lints]
workspace = true
