[package]
name = "multi"
description = "MULTI: live multilingual captions for video streams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
multi-core.workspace = true
multi-media.workspace = true
ctrlc = { version = "3", features = ["termination"] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
multi-fake-worker = { path = "../multi-fake-worker" }

# Re-runs its own executable as the fake worker, so it has its own main().
[[test]]
name = "supervisor"
harness = false

# Real GStreamer pipeline with the fake workers; re-runs itself as the fake
# worker, so it has its own main().
[[test]]
name = "pipeline"
harness = false
