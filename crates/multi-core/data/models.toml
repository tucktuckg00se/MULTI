# MULTI model registry (PRD §7 "Model storage and download", M1 WP7).
#
# Embedded in the binary and parsed by `multi_core::models`. Each model is
# fetched in exactly one way:
#   - `files`: plain downloads (`base_url/<path>` unless the file has its own
#     `url`), each checked against its SHA-256 and size;
#   - `archive`: one .tar.bz2 download checked by SHA-256, extracted into `dir`
#     (top-level folder stripped); `files` then lists what must be inside;
#   - `convert`: a Hugging Face repo at a pinned revision, converted locally
#     to CTranslate2 by scripts/convert-opus-mt.sh; `multi models pull` then
#     writes `manifest.json` with the SHA-256 of each output file.
# `dir` is relative to the models directory. `vram_mb` and `disk_mb` are
# approximate. Sources and licences: docs/m0/evidence/S4 and S5 models.txt.
#
# `target_token` (MT): the `>>id<<` token some multi-target opus-mt models
# need at the start of each sentence; `multi-mt --prefix` adds it.
#
# `language`: every language code used below, with its script. The caption
# formats follow from the script: CEA-608 and (in MULTI today) 708 carry
# Latin only; WebVTT carries any script. `latin_extended` marks Latin
# languages with letters outside CEA-608's character sets.
#
# The opus-mt catalogue (M2-1): every Apache-2.0 / CC-BY-4.0 Helsinki-NLP
# en->X single-language pair with an ISO 639-1 target, and X->en for the
# languages Nemotron transcribes, revisions pinned 2026-09-28 from the
# Hugging Face API. Users add or override entries in
# ~/.config/multi/models.toml (same schema).

