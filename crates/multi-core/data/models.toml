# ---------------------------------------------------------------- ASR
#
# `languages`: what the source language (`languages[i].source`) may be; it
# is passed to the worker explicitly (`multi-asr --lang`), which R1 measured
# 0.4-0.7 WER points better than `auto`.
#
# Nemotron 3.5 Streaming: the model card's 19 "transcription-ready" locales
# (15 codes; variants such as en-GB, es-419, pt-PT, fr-CA share a code).
# Not offered: "broad-coverage" pl sv cs nb da bg fi hr sk zh hu ro et and
# "adaptation-ready" el lt lv mt sl he th nn (lower accuracy; fine-tuning).
# MLS WER with the language set (R1): es 6.5, fr 9.9, de 10.4, pt 6.5.
#
#
# ASR entries (M2-5) carry `engine` (how multi-asr runs them), `chunk_ms`
# (Nemotron: the chunk the export was made for, which sets asr.chunk_ms;
# Whisper: the interval between LocalAgreement passes), `lag_ms` (typical
# caption lag after a word, p50, S4/M2-5 runs at 1x on an RTX 3090) and a
# one-line `note` for the GUI's model picker. One Nemotron export per chunk
# size; the fp32 files other than encoder.onnx are identical across chunks.
#
# Whisper (ggml files from the whisper.cpp model repo, MIT): the 98 of its
# 100 languages that have an ISO 639-1 code (not Hawaiian or Cantonese;
# Javanese is `jv` here, `jw` in Whisper). R1: WER es 5.2, fr 8.1, de 6.2,
# pt 8.8 for turbo; recommended for German.

[[model]]
id = "nemotron-3.5-streaming-560ms"
kind = "asr"
backend = "sherpa-onnx"
engine = "sherpa-streaming"
chunk_ms = 560
lag_ms = 840
note = "Default: low lag, the best balance"
default = true
languages = ["en", "es", "fr", "it", "pt", "nl", "de", "tr", "ru", "ar", "hi", "ja", "ko", "vi", "uk"]
